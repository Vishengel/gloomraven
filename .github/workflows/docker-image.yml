name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The Pi needs arm64, which is emulated on GitHub's amd64 runners
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          # Overwritten on every push; the sha tag keeps a way back to an earlier build
          tags: |
            ghcr.io/vishengel/gloomraven:latest
            ghcr.io/vishengel/gloomraven:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
