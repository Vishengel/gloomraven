<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloomraven</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0c10;
      --card: #19161c;
      --card-edge: #3a2f24;
      --text: #e9e1d3;
      --muted: #9b9083;
      --bronze: #c39a5b;
      --bronze-dim: #7d6440;
      --ok: #8fc98a;
      --bad: #d9705f;
      --glow: transparent;
      --fire: #ff6a3d; --ice: #6fb7ff; --air: #c9e6f2; --earth: #7cc36b; --light: #ffd36b; --dark: #9b6be0;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; min-height: 100vh; color: var(--text);
      font: 16px/1.45 system-ui, sans-serif;
      /* The room glows in the colour of the strongest active element */
      background:
        radial-gradient(ellipse 90% 45% at 50% 0%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 70%),
        radial-gradient(ellipse 120% 80% at 50% 50%, #17131a, var(--bg));
      background-attachment: fixed;
    }
    body[data-element=FIRE] { --glow: var(--fire); } body[data-element=ICE] { --glow: var(--ice); }
    body[data-element=AIR] { --glow: var(--air); } body[data-element=EARTH] { --glow: var(--earth); }
    body[data-element=LIGHT] { --glow: var(--light); } body[data-element=DARK] { --glow: var(--dark); }
    main { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; }

    header { display: flex; align-items: center; gap: 12px; padding: 4px 2px 0; }
    header svg { width: 44px; height: 44px; flex: none; fill: #050406; stroke: var(--bronze-dim); stroke-width: 1; }
    h1 { margin: 0; font: 600 1.7rem/1.1 var(--serif); letter-spacing: 0.04em; color: var(--bronze); }
    .tagline { margin: 2px 0 0; font: italic 0.9rem var(--serif); color: var(--muted); }
    .element-rule {
      height: 2px; border-radius: 2px; opacity: 0.7;
      background: linear-gradient(90deg, var(--fire), var(--light), var(--earth), var(--air), var(--ice), var(--dark));
    }

    section {
      padding: 14px 16px; border-radius: 12px;
      background: linear-gradient(180deg, #1d1920, var(--card));
      border: 1px solid var(--card-edge);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.03), 0 8px 24px rgb(0 0 0 / 0.35);
    }
    h2 {
      margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
      font: 600 0.8rem var(--serif); text-transform: uppercase; letter-spacing: 0.14em; color: var(--bronze);
    }
    h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--bronze-dim), transparent); }
    h3 { margin: 14px 0 2px; font: 600 1.05rem var(--serif); color: var(--text); }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .muted { color: var(--muted); }
    .detail { font-size: 0.85rem; }

    .status-line { display: flex; align-items: center; gap: 8px; }
    .status-line + .status-line { margin-top: 4px; }
    .dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--muted); }
    .ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .bad .dot { background: var(--bad); }

    /* Active elements as glowing runes; waning ones dashed and dimmer */
    #elements { display: flex; flex-wrap: wrap; gap: 8px; }
    .element {
      --c: var(--muted);
      padding: 4px 12px; border-radius: 999px; border: 1px solid var(--c);
      font: 600 0.9rem var(--serif); letter-spacing: 0.06em; text-transform: capitalize;
      color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--c) 45%, transparent);
      animation: smoulder 3s ease-in-out infinite;
    }
    .element.HALF { border-style: dashed; opacity: 0.6; box-shadow: none; animation: none; }
    .element.FIRE { --c: var(--fire); } .element.ICE { --c: var(--ice); } .element.AIR { --c: var(--air); }
    .element.EARTH { --c: var(--earth); } .element.LIGHT { --c: var(--light); } .element.DARK { --c: var(--dark); }
    @keyframes smoulder { 50% { box-shadow: 0 0 20px color-mix(in srgb, var(--c) 65%, transparent); } }
    @media (prefers-reduced-motion: reduce) { .element { animation: none; } }

    #light-tree { margin: 6px 0 14px; }
    .line { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgb(255 255 255 / 0.04); }
    .row { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; }
    .row input[type=checkbox] { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--bronze); }
    .group-row { font-weight: 600; }
    .members { margin-left: 30px; }
    input[type=text] {
      flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--card-edge); border-radius: 6px;
      background: var(--bg); color: var(--text); font: inherit;
    }
    input[type=text]:focus { outline: 2px solid var(--bronze-dim); outline-offset: 1px; }

    .buttons { display: flex; gap: 8px; }
    [hidden] { display: none !important; }
    button {
      flex: 1; padding: 10px; border-radius: 8px; cursor: pointer;
      font: 600 0.95rem var(--serif); letter-spacing: 0.04em;
      border: 1px solid #d8b67a; color: #1a130b; background: linear-gradient(180deg, #d6b273, #a9824a);
    }
    button.secondary { border-color: var(--card-edge); color: var(--text); background: #241f27; }
    button:hover:not(:disabled) { filter: brightness(1.12); }
    button:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.pulse { flex: none; padding: 4px 10px; font-size: 0.8rem; }
    #lights-message, #settings-message { margin-top: 8px; font-size: 0.9rem; }

    .setting { display: grid; gap: 4px; padding: 6px 0; }
    .setting-header { display: flex; justify-content: space-between; gap: 8px; }
    .setting output { font: 600 1rem var(--serif); color: var(--bronze); }
    .setting input[type=range] { width: 100%; accent-color: var(--bronze); }
  </style>
</head>
<body>
<main>
  <header>
    <!-- An original low-poly raven -->
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M3 27 17 21 23 13 33 10 41 15 43 24 56 33 62 46 50 42 43 50 31 51 22 43 19 33 15 29Z"/>
      <circle cx="31" cy="17" r="1.8" fill="var(--bronze)" stroke="none"/>
    </svg>
    <div>
      <h1>Gloomraven</h1>
      <p class="tagline">The elements, in the lights of the room</p>
    </div>
  </header>
  <div class="element-rule"></div>
  <section>
    <h2>The table</h2>
    <div id="connection" class="status-line muted"><span class="dot"></span><span>Loading…</span></div>
    <div id="scenario" class="status-line muted">–</div>
  </section>
  <section>
    <h2>Active elements</h2>
    <div id="elements" class="muted">–</div>
  </section>
  <section>
    <h2>Lights</h2>
    <div id="lights" class="muted">–</div>
    <div id="light-tree"></div>
    <div class="buttons" id="select-buttons">
      <button id="save-lights" disabled>Save</button>
      <button id="rename" class="secondary">Rename</button>
      <button id="rediscover-lights" class="secondary">Search again</button>
    </div>
    <div class="buttons" id="rename-buttons" hidden>
      <button id="save-names">Save names</button>
      <button id="cancel-rename" class="secondary">Cancel</button>
    </div>
    <div id="lights-message" class="muted"></div>
  </section>
  <section>
    <h2>Settings</h2>
    <div id="settings"></div>
    <div id="settings-message" class="muted"></div>
  </section>
</main>
<script>
  const byId = (id) => document.getElementById(id);

  function element(tag, { dataset = {}, ...properties } = {}, children = []) {
    const node = Object.assign(document.createElement(tag), properties);
    Object.assign(node.dataset, dataset);
    node.append(...children);
    return node;
  }

  // Status

  function render(status) {
    byId("connection").className = `status-line ${status.connected_to_x_haven ? "ok" : "bad"}`;
    byId("connection").lastChild.textContent =
      (status.connected_to_x_haven ? "Connected to X-Haven at " : "Not connected to X-Haven at ") +
      status.x_haven_address;

    byId("scenario").textContent =
      status.scenario === null ? "No game state received yet" : `${status.scenario}, round ${status.round}`;

    const elements = Object.entries(status.active_elements);
    byId("elements").replaceChildren(...elements.map(([name, level]) => element("span", {
      className: `element ${name} ${level}`,
      textContent: `${name.toLowerCase()}${level === "HALF" ? " (waning)" : ""}`,
    })));
    if (!elements.length) byId("elements").textContent = "None";
    const strongest = elements.find(([, level]) => level === "FULL") ?? elements[0];
    document.body.dataset.element = strongest ? strongest[0] : "";

    byId("lights").textContent = `Controlling ${status.n_controlled_lights} lights`;
  }

  async function refresh() {
    try {
      const response = await fetch("/api/status");
      render(await response.json());
    } catch {
      byId("connection").className = "status-line bad";
      byId("connection").lastChild.textContent = "Gloomraven is not reachable";
    }
  }

  // Lights: rooms, then groups within a room, then single lights. Selecting a group selects its lights

  let lights = { lights: [], names: {} };
  let renaming = false;

  const lightCheckboxes = () => [...byId("light-tree").querySelectorAll("input[data-light]")];
  const checkedKeys = () => lightCheckboxes().filter((checkbox) => checkbox.checked).map((checkbox) => checkbox.dataset.light);

  function groupByKey(items, getKey) {
    const groups = new Map();
    for (const item of items) {
      const key = getKey(item);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    }
    return groups;
  }

  // The bulbs only know ids; names are typed in here. Until then, number them in the order they are found
  function nameLabel(nameKey, defaultName, detail) {
    if (renaming) {
      return element("input", { type: "text", value: lights.names[nameKey] ?? "", placeholder: defaultName, dataset: { nameKey } });
    }
    const children = [lights.names[nameKey] ?? defaultName];
    if (detail) children.push(" ", element("span", { className: "muted detail", textContent: detail }));
    return element("span", {}, children);
  }

  function lightRow(light) {
    const checkbox = element("input", { type: "checkbox", checked: light.selected, dataset: { light: light.key } });
    checkbox.addEventListener("change", updateSelectionState);
    const detail = lights.names[light.key] ? `${light.key}, ${light.description}` : light.description;
    const label = element("label", { className: "row" }, [checkbox, nameLabel(light.key, light.key, detail)]);
    return element("div", { className: "line" }, [label, pulseButton([light.key], lights.names[light.key] ?? light.key)]);
  }

  function pulseButton(lightKeys, name) {
    const button = element("button", { className: "secondary pulse", textContent: "Pulse", ariaLabel: `Pulse ${name}` });
    button.hidden = renaming;
    button.addEventListener("click", async () => {
      button.disabled = true;
      try {
        const response = await fetch("/api/lights/pulse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ light_keys: lightKeys }),
        });
        if (!response.ok) throw new Error(response.statusText);
      } catch (error) {
        byId("lights-message").textContent = `Pulse failed: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
    return button;
  }

  function groupBlock(groupLights) {
    const groupNumber = groupLights[0].group.split("/").at(-1);  // The bulbs number their groups per room
    const checkbox = element("input", { type: "checkbox", dataset: { group: groupLights[0].group } });
    checkbox.addEventListener("change", () => {
      for (const light of groupLights) {
        byId("light-tree").querySelector(`input[data-light="${CSS.escape(light.key)}"]`).checked = checkbox.checked;
      }
      updateSelectionState();
    });
    const nameKey = `group:${groupLights[0].group}`;
    const header = element("div", { className: "line" }, [
      element("label", { className: "row group-row" }, [checkbox, nameLabel(nameKey, `Group ${groupNumber}`)]),
      pulseButton(groupLights.map((light) => light.key), lights.names[nameKey] ?? `Group ${groupNumber}`),
    ]);
    return element("div", {}, [header, element("div", { className: "members" }, groupLights.map(lightRow))]);
  }

  function renderLights() {
    // Sorted, so the numbering of unnamed rooms stays the same however the lights are found
    const sortKey = (light) => `${light.room ?? "~"} ${light.group ?? "~"} ${light.key}`;
    const sortedLights = [...lights.lights].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
    const rooms = groupByKey(sortedLights, (light) => light.room);
    let roomNumber = 0;
    const blocks = [];
    for (const [room, roomLights] of rooms) {
      if (rooms.size > 1 || room !== null) {
        const heading = room === null ? "Other lights" : nameLabel(`room:${room}`, `Room ${++roomNumber}`);
        blocks.push(element("h3", {}, [heading]));
      }
      const groups = groupByKey(roomLights, (light) => light.group);
      for (const [group, groupLights] of groups) {
        if (group !== null) blocks.push(groupBlock(groupLights));
      }
      blocks.push(...(groups.get(null) ?? []).map(lightRow));
    }
    byId("light-tree").replaceChildren(...blocks);
    byId("select-buttons").hidden = renaming;
    byId("rename-buttons").hidden = !renaming;
    byId("light-tree").querySelectorAll("input[type=checkbox]").forEach((checkbox) => (checkbox.disabled = renaming));
    updateSelectionState();
  }

  function updateSelectionState() {
    // A group's checkbox shows whether all, some or none of its lights are selected
    for (const groupCheckbox of byId("light-tree").querySelectorAll("input[data-group]")) {
      const members = lights.lights.filter((light) => light.group === groupCheckbox.dataset.group);
      const checked = members.filter((light) => checkedKeys().includes(light.key)).length;
      groupCheckbox.checked = checked === members.length;
      groupCheckbox.indeterminate = checked > 0 && checked < members.length;
    }
    const keys = checkedKeys();
    const savedKeys = lights.lights.filter((light) => light.selected).map((light) => light.key);
    const unchanged = keys.length === savedKeys.length && keys.every((key) => savedKeys.includes(key));
    byId("save-lights").disabled = !keys.length || unchanged;
    byId("rename").disabled = !unchanged;  // Renaming redraws the list, which would lose unsaved ticks
    byId("lights-message").textContent = keys.length ? "" : "Pick at least one light";
  }

  async function callLightsApi(method, path, body) {
    const buttons = [...document.querySelectorAll("#select-buttons button, #rename-buttons button")];
    buttons.forEach((button) => (button.disabled = true));
    byId("lights-message").textContent = method === "GET" ? "" : "Working on it…";
    try {
      const response = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body && JSON.stringify(body),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : response.statusText);
      lights = result;
      renaming = false;
      renderLights();
      if (method !== "GET") byId("lights-message").textContent = "Done";
    } catch (error) {
      byId("lights-message").textContent = `Failed: ${error.message}`;
    } finally {
      buttons.filter((button) => button.id !== "save-lights").forEach((button) => (button.disabled = false));
    }
  }

  byId("save-lights").addEventListener("click", () =>
    callLightsApi("PUT", "/api/lights", { light_keys: checkedKeys() }));
  byId("rediscover-lights").addEventListener("click", () =>
    callLightsApi("POST", "/api/lights/rediscover"));
  byId("rename").addEventListener("click", () => {
    renaming = true;
    renderLights();
  });
  byId("cancel-rename").addEventListener("click", () => {
    renaming = false;
    renderLights();
  });
  byId("save-names").addEventListener("click", () => {
    const names = { ...lights.names };
    for (const input of byId("light-tree").querySelectorAll("input[data-name-key]")) {
      names[input.dataset.nameKey] = input.value;
    }
    callLightsApi("PUT", "/api/lights/names", { names });
  });

  // Settings: one slider per integer setting with a minimum and maximum, built from the settings' JSON schema

  function settingSlider(key, field, value, values) {
    const unit = field.unit ?? "";
    const output = element("output", { textContent: `${value} ${unit}` });
    const slider = element("input", {
      type: "range", id: `setting-${key}`, min: field.minimum, max: field.maximum, value,
    });
    slider.addEventListener("input", () => (output.textContent = `${slider.value} ${unit}`));
    // Saved when the slider is let go, not on every step
    slider.addEventListener("change", () => saveSettings({ ...values, [key]: Number(slider.value) }));
    return element("div", { className: "setting" }, [
      element("div", { className: "setting-header" }, [element("label", { htmlFor: slider.id, textContent: field.title }), output]),
      slider,
      element("div", { className: "muted detail", textContent: field.description ?? "" }),
    ]);
  }

  function renderSettings({ values, json_schema }) {
    const sliders = Object.entries(json_schema.properties)
      .filter(([, field]) => field.type === "integer" && "minimum" in field && "maximum" in field)
      .map(([key, field]) => settingSlider(key, field, values[key], values));
    byId("settings").replaceChildren(...sliders);
  }

  async function callSettingsApi(method, values) {
    try {
      const response = await fetch("/api/settings", {
        method,
        headers: { "Content-Type": "application/json" },
        body: values && JSON.stringify(values),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : response.statusText);
      renderSettings(result);
      byId("settings-message").textContent = method === "GET" ? "" : "Saved";
    } catch (error) {
      byId("settings-message").textContent = `Failed: ${error.message}`;
    }
  }

  const saveSettings = (values) => callSettingsApi("PUT", values);

  refresh();
  setInterval(refresh, 2000);
  callSettingsApi("GET");
  callLightsApi("GET", "/api/lights");
</script>
</body>
</html>
