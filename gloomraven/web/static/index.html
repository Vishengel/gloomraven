<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloomraven</title>
  <style>
    :root { color-scheme: dark; --bg: #16131a; --card: #221e28; --text: #ece6f2; --muted: #9a92a6; --ok: #6fcf8e; --bad: #e66a6a; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    section { background: var(--card); border-radius: 10px; padding: 12px 16px; }
    h2 { margin: 0 0 6px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .muted { color: var(--muted); }
    #elements { display: flex; flex-wrap: wrap; gap: 6px; }
    .element { padding: 2px 10px; border-radius: 999px; font-size: 0.9rem; color: #111; }
    .element.HALF { opacity: 0.55; }
    .FIRE { background: #ff5a3c; } .ICE { background: #5aa8ff; } .AIR { background: #b8e4ff; }
    #light-list { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 2px; }
    #light-list label { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
    #light-list input { width: 20px; height: 20px; accent-color: #8a5ad8; }
    .buttons { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font: inherit; background: #8a5ad8; color: #fff; cursor: pointer; }
    button.secondary { background: #3a3442; }
    button:disabled { opacity: 0.4; cursor: default; }
    #lights-message { margin-top: 8px; font-size: 0.9rem; }
    .EARTH { background: #6fcf6f; } .LIGHT { background: #ffe58a; } .DARK { background: #8a5ad8; color: #fff; }
  </style>
</head>
<body>
<main>
  <h1>Gloomraven</h1>
  <section>
    <h2>X-Haven server</h2>
    <div id="connection" class="muted">Loading…</div>
  </section>
  <section>
    <h2>Scenario</h2>
    <div id="scenario" class="muted">–</div>
  </section>
  <section>
    <h2>Active elements</h2>
    <div id="elements" class="muted">–</div>
  </section>
  <section>
    <h2>Lights</h2>
    <div id="lights" class="muted">–</div>
    <ul id="light-list"></ul>
    <div class="buttons">
      <button id="save-lights" disabled>Save</button>
      <button id="rediscover-lights" class="secondary">Search again</button>
    </div>
    <div id="lights-message" class="muted"></div>
  </section>
</main>
<script>
  const byId = (id) => document.getElementById(id);

  function render(status) {
    byId("connection").className = status.connected_to_x_haven ? "ok" : "bad";
    byId("connection").textContent =
      (status.connected_to_x_haven ? "Connected to " : "Not connected to ") + status.x_haven_address;

    byId("scenario").textContent =
      status.scenario === null ? "No game state received yet" : `${status.scenario}, round ${status.round}`;

    const elements = Object.entries(status.active_elements);
    byId("elements").replaceChildren(...elements.map(([element, level]) => {
      const chip = document.createElement("span");
      chip.className = `element ${element} ${level}`;
      chip.textContent = `${element.toLowerCase()}${level === "HALF" ? " (waning)" : ""}`;
      return chip;
    }));
    if (!elements.length) byId("elements").textContent = "None";

    byId("lights").textContent = `Controlling ${status.n_controlled_lights} lights`;
  }

  async function refresh() {
    try {
      const response = await fetch("/api/status");
      render(await response.json());
    } catch {
      byId("connection").className = "bad";
      byId("connection").textContent = "Gloomraven is not reachable";
    }
  }

  let savedKeys = [];

  const checkedKeys = () =>
    [...byId("light-list").querySelectorAll("input:checked")].map((checkbox) => checkbox.value);

  function updateSaveButton() {
    const keys = checkedKeys();
    const unchanged = keys.length === savedKeys.length && keys.every((key) => savedKeys.includes(key));
    byId("save-lights").disabled = !keys.length || unchanged;
    byId("lights-message").textContent = keys.length ? "" : "Pick at least one light";
  }

  function renderLights({ lights }) {
    savedKeys = lights.filter((light) => light.selected).map((light) => light.key);
    byId("light-list").replaceChildren(...lights.map((light) => {
      const item = document.createElement("li");
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = light.key;
      checkbox.checked = light.selected;
      checkbox.addEventListener("change", updateSaveButton);
      const description = document.createElement("span");
      description.className = "muted";
      description.textContent = `(${light.description})`;
      label.append(checkbox, `${light.key} `, description);
      item.append(label);
      return item;
    }));
    updateSaveButton();
  }

  async function callLightsApi(method, path, body) {
    const buttons = [byId("save-lights"), byId("rediscover-lights")];
    buttons.forEach((button) => (button.disabled = true));
    byId("lights-message").textContent = method === "GET" ? "" : "Working on it…";
    try {
      const response = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body && JSON.stringify(body),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : response.statusText);
      renderLights(result);
      if (method !== "GET") byId("lights-message").textContent = "Done";
    } catch (error) {
      byId("lights-message").textContent = `Failed: ${error.message}`;
    } finally {
      byId("rediscover-lights").disabled = false;
    }
  }

  byId("save-lights").addEventListener("click", () =>
    callLightsApi("PUT", "/api/lights", { light_keys: checkedKeys() }));
  byId("rediscover-lights").addEventListener("click", () =>
    callLightsApi("POST", "/api/lights/rediscover"));

  refresh();
  setInterval(refresh, 2000);
  callLightsApi("GET", "/api/lights");
</script>
</body>
</html>
