# Match project’s Python and line length preferences
target-version = "py310"
line-length = 120

# Auto-fix what’s safe by default, and allow pyupgrade-style modernizations
fix = true
unsafe-fixes = true

# Respect our existing ignore/exclude patterns
exclude = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
  # From .flake8
  "ml_services/dev/models/yolov5/models/*",
  "ml_services/dev/models/yolov5/utils/*",
]
extend-exclude = [
  # From .flake8
  "tests/fixtures/*",
  "tests/**/fixtures/*",
]

[lint]
# Replace Flake8 core + our plugins + pyupgrade + pydocstyle + isort + hygiene
# E,F: Flake8 core (pycodestyle/pyflakes)
# B: flake8-bugbear
# A: flake8-builtins
# C4: flake8-comprehensions
# PTH: flake8-use-pathlib
# UP: pyupgrade
# D: pydocstyle
# I: isort-equivalent import sorting
# RUF: Ruff-specific (e.g., unused noqa)
select = ["E", "F", "B", "A", "C4", "PTH", "UP", "D", "I", "RUF"]

# Align with our existing ignores:
# - E203 to be compatible with Black-style formatting
# - Allow plain open() calls (equivalent of the PL123 note -> Ruff's PLR1732)
# - Don’t require docstrings (our pylint disabled missing-docstring checks)
# - Don't require blank line after a docstring
ignore = [
  "E203",
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # no docstring required
  "D205",  # 1 blank line required between summary line and description
]

# We can configure per-file ignores below
# [lint.per-file-ignores]
# "__init__.py" = ["F401", "F403"]


[format]
# Use Ruff Formatter to replace Black
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[lint.pydocstyle]
# Keep docstring style conservative; docstring presence is disabled above (D10x)
convention = "pep257"

[lint.isort]
# Match our isort profile=black and project layout
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["ml_services"]

[lint.pyupgrade]
# Mirror our old pyupgrade setup
keep-runtime-typing = true
